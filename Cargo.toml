[package]
authors = ["Ruiqi Lei <Rn7s2@outlook.com>"]
categories = ["api-bindings", "finance"]
description = "Safe & idiomatic Rust bindings for CTP; cross-platform (Windows/Linux/macOS)"
edition = "2024"
keywords = ["ctp", "futures", "trading", "ctp2rs", "quant"]
license = "MIT"
name = "ctp-rs"
readme = "README.md"
repository = "https://github.com/rn7s2/ctp-rs.git"
version = "0.4.0+ctp.6.7.13.darwin.6.7.7"

[dependencies]
cxx = "1.0"

[build-dependencies]
cc = "1.0"
cxx-build = "1.0"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
